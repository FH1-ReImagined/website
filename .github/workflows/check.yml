# Pull requests: assemble the site as the Pages workflow does and check that every local link
# and image of the pages is there and the data files parse (tools/check_site.py), then test the
# community photos and designs builds on fixture feeds of synthetic images, with the pages in
# headless Chrome (tools/test_build_gallery.py, tools/test_build_designs.py), and the account page
# against a stand-in for the accounts service's /api/ (tools/test_account_page.py), and the mods
# and texture packs hub's build and pages against a stand-in for its /api/hub/ (tools/test_build_hub.py), and
# the photos and designs shown before the next build, with the partial build and its webhook
# (tools/test_live_community.py).
name: check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/assemble.sh "$RUNNER_TEMP/site"
      - run: python3 tools/check_site.py "$RUNNER_TEMP/site"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: python -m pip install -r tools/requirements.txt
      - run: python tools/test_build_gallery.py
      - run: python tools/test_build_designs.py
      - run: python tools/test_account_page.py
      - run: python tools/test_build_hub.py
      - run: python tools/test_live_community.py
